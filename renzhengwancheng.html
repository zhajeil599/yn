<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>实名认证成功 - 领取彩金</title>
<style>
  /* 基础重置与容器居中 */
  body {
    margin: 0;
    padding: 0;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* 核心 375 * 812 容器 */
  .app-container {
    width: 375px;
    height: 812px;
    background: url('https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat; 
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }

  /* 全屏黑色半透明蒙层 */
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* 弹窗通用样式 */
  .modal {
    width: 310px;
    background: linear-gradient(145deg, #ffffff, #ffebeb);
    border-radius: 20px;
    padding: 35px 20px 30px;
    box-sizing: border-box;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    position: relative;
  }

  /* 成功图标动效 */
  .success-icon {
    font-size: 64px;
    margin-bottom: 10px;
    /* 采用弹簧效果的出现动画 */
    animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    transform: scale(0);
  }

  .title {
    font-size: 24px;
    font-weight: 800;
    color: #4caf50; /* 成功状态使用绿色调更合适，或者保持 #d32f2f */
    margin: 10px 0 15px 0;
  }

  .desc {
    font-size: 16px;
    color: #333;
    font-weight: bold;
    margin-bottom: 5px;
  }

  /* 弱化的小字提示 */
  .small-tips {
    display: inline-block;
    font-size: 13px;
    color: #888;
    background-color: #f5f5f5;
    padding: 4px 12px;
    border-radius: 12px;
    margin-top: 8px;
    margin-bottom: 25px;
    font-weight: normal;
  }

  /* 金额展示 */
  .amount-box {
    margin: 10px 0;
  }
  .amount {
    font-size: 64px;
    font-weight: 900;
    color: #f44336;
    text-shadow: 0px 4px 10px rgba(244, 67, 54, 0.3);
  }
  .amount::before {
    content: "￥";
    font-size: 28px;
    margin-right: 2px;
  }

  /* 醒目的主按钮 */
  .btn-primary {
    background: linear-gradient(90deg, #ff9800, #ff3d00);
    color: #fff;
    border: none;
    width: 100%;
    padding: 16px 0;
    font-size: 18px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(255, 61, 0, 0.4);
    transition: transform 0.1s;
  }
  .btn-primary:active {
    transform: scale(0.96);
  }

  /* 弱化的次要按钮 */
  .btn-close {
    margin-top: 15px;
    background: transparent;
    border: none;
    color: #aaa;
    font-size: 14px;
    cursor: pointer;
    padding: 10px;
    display: block;
    width: 100%;
  }

  /* Keyframes 动画 */
  @keyframes popIn {
    0% { transform: scale(0); }
    80% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="overlay" id="overlay">
    
    <!-- 认证成功模态框 -->
    <div class="modal">
      <div class="success-icon">🎉</div>
      <h2 class="title" style="color: #d32f2f;">恭喜完成认证</h2>
      
      <div class="amount-box">
        <div class="amount">88</div>
      </div>

      <div class="desc">彩金已成功发放</div>
      <div class="small-tips">完成 880 流水即可提现</div>

      <button class="btn-primary" onclick="alert('跳转至游戏大厅或资产页面去打流水...')">立即领取</button>
      <button class="btn-close" onclick="closeModal()">我知道了</button>
    </div>

  </div>
</div>

<script>
  // 关闭弹窗逻辑
  function closeModal() {
    const overlay = document.getElementById('overlay');
    // 添加简单的渐隐效果
    overlay.style.transition = "opacity 0.3s";
    overlay.style.opacity = "0";
    setTimeout(() => {
      overlay.style.display = "none";
    }, 300);
  }
</script>

</body>
</html>
